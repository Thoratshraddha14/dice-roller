<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice-Roller</title>
    <style>
        .container{
            width: 500px;
            background-color: white;
            border: 1px solid #006bb3;
            border-radius: 10px;
            box-shadow: 60px 30px 50px #c2c2d6;
            margin: 70px auto;
        }
        .heading{
           text-align: center;
           font-size: 40px;
           color: #006bb3;
        }
        .dice{
            height: 200px;
            margin-left: 150px;
        }
        .btn{
            height: 50px;
            width: 150px;
            display: block;
            margin: 20px auto;
            font-size: 40px;
            border-radius: 10px;
            border: 4px solid #e6f5ff;
            background-color: #008ae6;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="heading">Dice-Roller</h2>
        <img src="./image/dice.png" class="dice" id="dice">
        <div>
            <button class="btn" onclick="diceRoller()">Roll</button>
        </div>
    </div>
     <script>
        function diceRoller(){
            const min=1;
            const max=6;
            const diceElement=document.getElementById("dice");
            const random =Math.floor(Math.random()*(max-min+1))+min;
            
            switch(random){
            case 1:
                diceElement.src="./image/one.png"
                break;
            case 2:
                diceElement.src="./image/two.png"
                break;
            case 3:
                diceElement.src="./image/three.png"
                break;
            case 4:
                diceElement.src="./image/four.png"
                break;
            case 5:
                diceElement.src="./image/five.png"
                break;
            case 6:
                diceElement.src="./image/six.png"
                break;
            
        }
        }
    </script>
</body>
</html>
