<head>

    <title>Dice-Roller</title>
    <style>
        .container{
            width: 500px;
            background-color: white;

    <div class="container">
         <h2 class="heading">Dice-Roller</h2>
         <img src="./image/dice.png" class="dice" id="dice">

    </div>

</html>
